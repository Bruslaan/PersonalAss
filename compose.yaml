services:
  browser:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      VIEW_USERNAME: "${VIEW_USERNAME:?Set VIEW_USERNAME in .env}"
      VIEW_PASSWORD: "${VIEW_PASSWORD:?Set VIEW_PASSWORD in .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6.1-sol}"
    volumes:
      - browser-profile:/data
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 1.0
volumes:
  browser-profile:
